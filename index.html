<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minisúper Fénix - Sistema de Administración y Caja</title>
  
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AdminFénix">
  
  <link rel="icon" type="image/png" href="./logo-fenix.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>

  <div class="app-layout">

    <!-- BARRA LATERAL IZQUIERDA (AZUL MARINO Y ROJO FÉNIX) -->
    <aside class="sidebar">
      <div class="sidebar-brand-wrap" title="Minisúper Fénix">
        <img src="./logo-fenix.png" alt="Fénix Logo" class="sidebar-logo">
      </div>

      <nav class="sidebar-nav">
        <!-- 1. Hoja Diaria Fénix (Formato Real Papel) -->
        <button class="nav-item active" data-view="hoja" data-tooltip="Hoja de Cuadre Diaria" id="navBtnHoja">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        </button>

        <!-- 2. Agenda Semanal (Lunes a Domingo) -->
        <button class="nav-item" data-view="pipeline" data-tooltip="Agenda Semanal" id="navBtnPipeline">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"></rect><rect x="10" y="3" width="5" height="12" rx="1"></rect><rect x="17" y="3" width="5" height="15" rx="1"></rect></svg>
        </button>

        <!-- 3. Base de Datos de Proveedores (Catálogo Maestro) -->
        <button class="nav-item" data-view="proveedores" data-tooltip="Base de Datos de Proveedores" id="navBtnProveedores">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
        </button>

        <!-- 4. Estadísticas Generales y por Proveedor -->
        <button class="nav-item" data-view="estadisticas" data-tooltip="Estadísticas Generales y Proveedores" id="navBtnEstadisticas">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </button>
      </nav>

      <div class="sidebar-footer">
        <!-- Respaldo / Exportación -->
        <button class="nav-item" data-tooltip="Exportar y Respaldo" id="navBtnBackup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-area">

      <!-- TOP BAR SUPERIOR -->
      <header class="top-bar">
        <div class="top-bar-left">
          <div class="brand-header-flex">
            <img src="./logo-fenix.png" alt="Fénix" class="header-logo">
            <div class="page-title-group">
              <h1 id="pageTitle">Hoja Diaria - Minisúper Fénix</h1>
              <span class="page-subtitle" id="pageSubtitle">Control contable de compras, proveedores, corte y arqueo de caja</span>
            </div>
          </div>

          <!-- Selector de Modo de Vista para Pipeline -->
          <div class="view-switcher" id="viewSwitcher" style="display: none;">
            <button class="view-btn active" id="btnViewKanban" title="Vista de Tablero Kanban">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"></rect><rect x="14" y="3" width="7" height="18" rx="1"></rect></svg>
              <span>Tablero</span>
            </button>
            <button class="view-btn" id="btnViewList" title="Vista de Lista">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg>
              <span>Lista</span>
            </button>
          </div>
        </div>

        <!-- Buscador Universal -->
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="search-input" id="globalSearchInput" placeholder="Buscar proveedor, nota, pago o máquina...">
        </div>

        <!-- Acciones y Perfil a la Derecha -->
        <div class="top-bar-right">
          <div class="stats-pill" id="headerStatsPill">
            <span class="highlight">$0.00</span>
            <span>•</span>
            <span>0 pagados hoy</span>
          </div>

          <!-- Botón de Exportación Rápida para Móviles y Escritorio -->
          <button class="topbar-action-btn" id="btnTopBarBackup" title="Exportación y Respaldo (Excel, JSON, PDF)" aria-label="Exportar datos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          </button>

          <!-- Perfil y Sucursal -->
          <div class="user-profile">
            <div class="user-avatar">FX</div>
            <div class="user-info">
              <span class="user-name">Minisúper Fénix</span>
              <span class="user-role">Caja Principal</span>
            </div>
          </div>
        </div>
      </header>

      <!-- VISTA 1: HOJA DIARIA FÉNIX (FORMATO REAL EN PAPEL) -->
      <div class="view-container active" id="hojaDiariaViewContainer">
        <!-- Renderizado dinámico desde hojaDiaria.js -->
      </div>

      <!-- VISTA 2: PIPELINE SEMANAL (KANBAN LUNES A DOMINGO) -->
      <div class="view-container" id="pipelineViewContainer">
        <!-- Renderizado dinámico desde pipeline.js -->
      </div>

      <!-- VISTA 3: BASE DE DATOS DE PROVEEDORES (CATÁLOGO CENTRAL) -->
      <div class="view-container" id="proveedoresViewContainer">
        <!-- Renderizado dinámico desde proveedoresDb.js -->
      </div>

      <!-- VISTA 4: ESTADÍSTICAS GENERALES Y POR PROVEEDOR -->
      <div class="view-container" id="estadisticasViewContainer">
        <!-- Renderizado dinámico desde estadisticas.js -->
      </div>

    </main>

  </div>

  <!-- MODAL FLOTANTE GLOBAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container" id="modalContainer"></div>
  </div>

  <!-- Registro de Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('PWA ServiceWorker activo en:', reg.scope);
        }).catch(function(err) {
          console.warn('Registro SW no completado:', err);
        });
      });
    }
  </script>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
