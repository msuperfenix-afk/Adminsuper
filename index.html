<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minisúper Fénix - Sistema de Administración de Proveedores y Caja</title>
  
  <link rel="icon" type="image/png" href="./logo-fenix.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>

  <div class="app-layout">

    <!-- BARRA LATERAL IZQUIERDA (AZUL MARINO Y ROJO FÉNIX) -->
    <aside class="sidebar">
      <div class="sidebar-brand-wrap" title="Minisúper Fénix">
        <img src="./logo-fenix.png" alt="Fénix Logo" class="sidebar-logo">
      </div>

      <nav class="sidebar-nav">
        <!-- 1. Hoja Diaria Fénix (Formato Real Papel) -->
        <button class="nav-item active" data-view="hoja" data-tooltip="Hoja de Cuadre Diaria (Papel)" id="navBtnHoja">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        </button>

        <!-- 2. Pipeline Semanal (Lunes a Domingo) -->
        <button class="nav-item" data-view="pipeline" data-tooltip="Agenda Semanal (L-D)" id="navBtnPipeline">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"></rect><rect x="10" y="3" width="5" height="12" rx="1"></rect><rect x="17" y="3" width="5" height="15" rx="1"></rect></svg>
        </button>

        <!-- 3. Arqueos de Caja -->
        <button class="nav-item" data-view="operaciones" data-subtab="arqueos" data-tooltip="Cortes y Arqueos" id="navBtnArqueos">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
        </button>

        <!-- 4. Panaderos y Tortillerías -->
        <button class="nav-item" data-view="operaciones" data-subtab="panaderos" data-tooltip="Panaderos y Tortillerías" id="navBtnPan">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </button>

        <!-- 5. Pendientes de Pago -->
        <button class="nav-item" data-view="operaciones" data-subtab="pendientes" data-tooltip="Pendientes de Pago" id="navBtnPendientes">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span class="nav-badge" id="navBadgePendientes" style="display: none;">0</span>
        </button>

        <!-- 6. Retiros de Efectivo -->
        <button class="nav-item" data-view="operaciones" data-subtab="retiros" data-tooltip="Retiros de Efectivo" id="navBtnRetiros">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        </button>

        <!-- 7. Máquinas Cascada y Muñecos -->
        <button class="nav-item" data-view="operaciones" data-subtab="maquinas" data-tooltip="Máquinas Cascada & Muñecos" id="navBtnMaquinas">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="11" width="12" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4M9 16h6M9 16v-2M15 16v-2"></path></svg>
        </button>
      </nav>

      <div class="sidebar-footer">
        <!-- Respaldo / Base de Datos -->
        <button class="nav-item" data-tooltip="Copia de Seguridad (JSON)" id="navBtnBackup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-area">

      <!-- TOP BAR SUPERIOR -->
      <header class="top-bar">
        <div class="top-bar-left">
          <div class="brand-header-flex">
            <img src="./logo-fenix.png" alt="Fénix" class="header-logo">
            <div class="page-title-group">
              <h1 id="pageTitle">📄 Hoja Diaria Minisúper Fénix</h1>
              <span class="page-subtitle" id="pageSubtitle">Control contable de compras, proveedores, corte y arqueo de caja</span>
            </div>
          </div>

          <!-- Selector de Modo de Vista para Pipeline -->
          <div class="view-switcher" id="viewSwitcher" style="display: none;">
            <button class="view-btn active" id="btnViewKanban" title="Vista de Tablero Kanban">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"></rect><rect x="14" y="3" width="7" height="18" rx="1"></rect></svg>
              <span>Tablero</span>
            </button>
            <button class="view-btn" id="btnViewList" title="Vista de Lista">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg>
              <span>Lista</span>
            </button>
          </div>
        </div>

        <!-- Buscador Universal -->
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="search-input" id="globalSearchInput" placeholder="Buscar proveedor, nota, pago o máquina...">
        </div>

        <!-- Acciones y Perfil a la Derecha -->
        <div class="top-bar-right">
          <div class="stats-pill" id="headerStatsPill">
            <span class="highlight">$0.00</span>
            <span>•</span>
            <span>0 pagados hoy</span>
          </div>


          <!-- Perfil y Sucursal -->
          <div class="user-profile">
            <div class="user-avatar">FX</div>
            <div class="user-info">
              <span class="user-name">Minisúper Fénix</span>
              <span class="user-role">Caja Principal</span>
            </div>
          </div>
        </div>
      </header>

      <!-- VISTA 1: HOJA DIARIA FÉNIX (FORMATO REAL EN PAPEL) -->
      <div class="view-container active" id="hojaDiariaViewContainer">
        <!-- Renderizado dinámico desde hojaDiaria.js -->
      </div>

      <!-- VISTA 2: PIPELINE SEMANAL (KANBAN LUNES A DOMINGO) -->
      <div class="view-container" id="pipelineViewContainer">
        <!-- Renderizado dinámico desde pipeline.js -->
      </div>

      <!-- VISTA 3: CENTRO DE OPERACIONES DIARIAS Y CAJA -->
      <div class="view-container" id="operationsViewContainer">
        <!-- Renderizado dinámico desde cajaOperaciones.js -->
      </div>

    </main>

  </div>

  <!-- MODAL FLOTANTE GLOBAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container" id="modalContainer"></div>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
